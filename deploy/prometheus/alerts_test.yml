# Unit tests for alerts.yml with made-up data. Run from this directory:
#   promtool test rules alerts_test.yml
# They prove each rule fires when it should and stays quiet when it should.

rule_files:
  - alerts.yml

evaluation_interval: 1m

tests:
  - name: coordinator down for more than two minutes
    interval: 1m
    input_series:
      - series: 'up{job="api-coordinator", instance="api-coordinator:8090"}'
        values: "1 1 0 0 0 0 0"
    alert_rule_test:
      - eval_time: 3m
        alertname: CoordinatorDown
        exp_alerts: [] # down for under 2 minutes: still pending
      - eval_time: 6m
        alertname: CoordinatorDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: api-coordinator
              instance: "api-coordinator:8090"
            exp_annotations:
              summary: "The coordinator is down"
              description: "Prometheus cannot scrape the coordinator (api-coordinator:8090). Alerts cannot be sent and devices cannot register."

  - name: worker flapping briefly does not alert
    interval: 1m
    input_series:
      - series: 'up{job="fanout-worker", instance="fanout-worker:8081"}'
        values: "1 0 1 1 1 1"
    alert_rule_test:
      - eval_time: 5m
        alertname: WorkerDown
        exp_alerts: []

  - name: a lost shard lease alerts after a minute
    interval: 1m
    input_series:
      - series: 'pulsegrid_worker_lease_healthy{job="fanout-worker", instance="fanout-worker:8081"}'
        values: "1 1 0 0 0 0"
    alert_rule_test:
      - eval_time: 2m
        alertname: ShardLeaseLost
        exp_alerts: []
      - eval_time: 5m
        alertname: ShardLeaseLost
        exp_alerts:
          - exp_labels:
              severity: critical
              job: fanout-worker
              instance: "fanout-worker:8081"
            exp_annotations:
              summary: "A worker lost the lease on one of its shards"
              description: "Worker fanout-worker:8081 no longer holds every shard lease it owns. Another worker may have taken a shard, or Redis is unreachable."

  - name: a failed shard publish alerts at once, a clean history does not
    interval: 1m
    input_series:
      - series: 'pulsegrid_alert_shard_failures_total{job="api-coordinator", instance="api-coordinator:8090", shard="tkrt"}'
        values: "0 0 0 0 3 3 3"
      - series: 'pulsegrid_alert_shard_failures_total{job="api-coordinator", instance="api-coordinator:8090", shard="tkrw"}'
        values: "0 0 0 0 0 0 0"
    alert_rule_test:
      - eval_time: 3m
        alertname: AlertPublishFailures
        exp_alerts: []
      - eval_time: 6m
        alertname: AlertPublishFailures
        exp_alerts:
          - exp_labels:
              severity: critical
              job: api-coordinator
              instance: "api-coordinator:8090"
              shard: tkrt
            exp_annotations:
              summary: "Alerts failed to publish to a shard"
              description: "3 shard publishes failed in the last 10 minutes. Some areas did not receive an alert. Check NATS (JetStream)."

  - name: dropped alerts are reported per shard
    interval: 1m
    input_series:
      - series: 'pulsegrid_worker_alerts_dropped_total{job="fanout-worker", shard="tkrt"}'
        values: "0 0 5 5 5"
      - series: 'pulsegrid_worker_alerts_dropped_total{job="fanout-worker", shard="tkrs"}'
        values: "0 0 0 0 0"
    alert_rule_test:
      - eval_time: 4m
        alertname: DevicesDroppingAlerts
        exp_alerts:
          - exp_labels:
              severity: warning
              shard: tkrt
            exp_annotations:
              summary: "Alerts were dropped for slow devices"
              description: "Shard tkrt: 5 alerts were skipped in the last 10 minutes because a device's queue was full."

  - name: slow dispatch needs a sustained p99 above one second
    interval: 1m
    input_series:
      # Every observation lands in the 2.5 s bucket: p99 is far above 1 s.
      - series: 'pulsegrid_alert_dispatch_duration_seconds_bucket{job="api-coordinator", le="0.5"}'
        values: "0+0x30"
      - series: 'pulsegrid_alert_dispatch_duration_seconds_bucket{job="api-coordinator", le="2.5"}'
        values: "0+10x30"
      - series: 'pulsegrid_alert_dispatch_duration_seconds_bucket{job="api-coordinator", le="+Inf"}'
        values: "0+10x30"
    alert_rule_test:
      - eval_time: 5m
        alertname: SlowAlertDispatch
        exp_alerts: [] # not long enough yet
      - eval_time: 25m
        alertname: SlowAlertDispatch
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Alert dispatch is slow"
              description: "p99 time from accepting an alert to publishing it to every shard is 2.48 s (over 1 s for 10 minutes)."

  - name: fast dispatch stays quiet
    interval: 1m
    input_series:
      - series: 'pulsegrid_alert_dispatch_duration_seconds_bucket{job="api-coordinator", le="0.05"}'
        values: "0+10x30"
      - series: 'pulsegrid_alert_dispatch_duration_seconds_bucket{job="api-coordinator", le="+Inf"}'
        values: "0+10x30"
    alert_rule_test:
      - eval_time: 25m
        alertname: SlowAlertDispatch
        exp_alerts: []

  - name: server error rate above five percent for five minutes
    interval: 1m
    input_series:
      - series: 'pulsegrid_http_requests_total{job="api-coordinator", status="2xx"}'
        values: "0+10x30"
      - series: 'pulsegrid_http_requests_total{job="api-coordinator", status="5xx"}'
        values: "0+2x30"
    alert_rule_test:
      - eval_time: 3m
        alertname: HighServerErrorRate
        exp_alerts: []
      - eval_time: 12m
        alertname: HighServerErrorRate
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "The coordinator is returning server errors"
              description: "16.67% of HTTP responses were 5xx over the last 5 minutes. Check the coordinator log and Postgres."

  - name: a healthy coordinator with no 5xx series stays quiet
    interval: 1m
    input_series:
      - series: 'pulsegrid_http_requests_total{job="api-coordinator", status="2xx"}'
        values: "0+10x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: HighServerErrorRate
        exp_alerts: []

  - name: backup too old
    interval: 1m
    input_series:
      - series: 'pulsegrid_backup_interval_seconds{job="backup"}'
        values: "3600x200"
      # the newest good dump was made at second 100 and nothing since
      - series: 'pulsegrid_backup_last_success_timestamp_seconds{job="backup"}'
        values: "100x200"
    alert_rule_test:
      - eval_time: 60m
        alertname: BackupMissing
        exp_alerts: [] # 59 minutes old: well inside 1.5 intervals
      - eval_time: 120m
        alertname: BackupMissing
        exp_alerts:
          - exp_labels:
              severity: critical
              job: backup
            exp_annotations:
              summary: "No recent database backup"
              description: "The newest verified dump is 1h 58m 20s old, which is more than 1.5 backup intervals. Read the backup container's log."

  - name: backups arriving on time stay quiet
    interval: 1m
    input_series:
      - series: 'pulsegrid_backup_interval_seconds{job="backup"}'
        values: "3600x200"
      # a fresh dump every minute: the timestamp equals the current time
      - series: 'pulsegrid_backup_last_success_timestamp_seconds{job="backup"}'
        values: "0+60x200"
    alert_rule_test:
      - eval_time: 150m
        alertname: BackupMissing
        exp_alerts: []

  - name: failing backups alert after thirty minutes
    interval: 1m
    input_series:
      - series: 'pulsegrid_backup_last_run_success{job="backup"}'
        values: "1 1 0x60"
    alert_rule_test:
      - eval_time: 20m
        alertname: BackupFailing
        exp_alerts: []
      - eval_time: 40m
        alertname: BackupFailing
        exp_alerts:
          - exp_labels:
              severity: critical
              job: backup
            exp_annotations:
              summary: "Database backups are failing"
              description: "Every dump attempt for the last 30 minutes failed (it retries every 15 minutes). Read the backup container's log."

  - name: a stale off-server copy alerts only when off-site copies are enabled
    interval: 1m
    input_series:
      - series: 'pulsegrid_backup_interval_seconds{job="backup"}'
        values: "3600x200"
      - series: 'pulsegrid_backup_offsite_enabled{job="backup"}'
        values: "1x200"
      - series: 'pulsegrid_backup_offsite_last_success_timestamp_seconds{job="backup"}'
        values: "100x200"
    alert_rule_test:
      - eval_time: 120m
        alertname: OffsiteBackupMissing
        exp_alerts:
          - exp_labels:
              severity: critical
              job: backup
            exp_annotations:
              summary: "Backups are not reaching the off-server copy"
              description: "The last successful off-server copy is 1h 58m 20s old. A server failure now would lose the backups too. Check the remote and the rclone settings."

  - name: no off-server alert when off-site copies are switched off
    interval: 1m
    input_series:
      - series: 'pulsegrid_backup_interval_seconds{job="backup"}'
        values: "3600x200"
      - series: 'pulsegrid_backup_offsite_enabled{job="backup"}'
        values: "0x200"
      - series: 'pulsegrid_backup_offsite_last_success_timestamp_seconds{job="backup"}'
        values: "0x200"
    alert_rule_test:
      - eval_time: 150m
        alertname: OffsiteBackupMissing
        exp_alerts: []

  - name: a backup container that stops answering alerts after five minutes
    interval: 1m
    input_series:
      - series: 'up{job="backup", instance="backup:9187"}'
        values: "1 1 0x20"
    alert_rule_test:
      - eval_time: 4m
        alertname: BackupServiceDown
        exp_alerts: []
      - eval_time: 10m
        alertname: BackupServiceDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: backup
              instance: "backup:9187"
            exp_annotations:
              summary: "The backup service is not running"
              description: "Prometheus cannot reach the backup container, so no backups are being made."

  - name: disk below 15 percent warns, below 5 percent is critical
    interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{job="node-exporter", mountpoint="/"}'
        values: "100x10 10x30"
      - series: 'node_filesystem_size_bytes{job="node-exporter", mountpoint="/"}'
        values: "1000x40"
    alert_rule_test:
      - eval_time: 5m
        alertname: HostDiskSpaceLow
        exp_alerts: [] # 10% free is below 15%, but not for the required 10 minutes yet
      - eval_time: 30m
        alertname: HostDiskSpaceLow
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node-exporter
              mountpoint: "/"
            exp_annotations:
              summary: "The server's disk is getting full"
              description: "Only 1% of the disk is free. Dumps, the database and logs all live on it."
      - eval_time: 30m
        alertname: HostDiskSpaceCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              job: node-exporter
              mountpoint: "/"
            exp_annotations:
              summary: "The server's disk is almost full"
              description: "Only 1% of the disk is free. Postgres, the backups and the logs are about to fail. Free space now."

  - name: a disk with plenty of space stays quiet
    interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{job="node-exporter", mountpoint="/"}'
        values: "600x40"
      - series: 'node_filesystem_size_bytes{job="node-exporter", mountpoint="/"}'
        values: "1000x40"
    alert_rule_test:
      - eval_time: 30m
        alertname: HostDiskSpaceLow
        exp_alerts: []
      - eval_time: 30m
        alertname: HostDiskSpaceCritical
        exp_alerts: []
      - eval_time: 30m
        alertname: HostDiskFillingUp
        exp_alerts: []

  - name: a disk that is draining fast is flagged before it is full
    interval: 5m
    input_series:
      # 500 GB free, losing 40 GB every 5 minutes: gone in well under 24 hours
      - series: 'node_filesystem_avail_bytes{job="node-exporter", mountpoint="/"}'
        values: "500+0x0 460 420 380 340 300 260 220 180 140 100 60 20"
    alert_rule_test:
      - eval_time: 1h
        alertname: HostDiskFillingUp
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node-exporter
              mountpoint: "/"
            exp_annotations:
              summary: "The disk is on course to fill within a day"
              description: "At the rate of the last 6 hours the disk is full in under 24 hours."

  - name: low memory for ten minutes
    interval: 1m
    input_series:
      - series: 'node_memory_MemAvailable_bytes{job="node-exporter"}'
        values: "500x20 50x30"
      - series: 'node_memory_MemTotal_bytes{job="node-exporter"}'
        values: "1000x50"
    alert_rule_test:
      - eval_time: 15m
        alertname: HostMemoryLow
        exp_alerts: []
      - eval_time: 40m
        alertname: HostMemoryLow
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node-exporter
            exp_annotations:
              summary: "The server is short of memory"
              description: "Only 5% of memory is available. The kernel may start killing processes."

  - name: postgres and redis down alert after two minutes
    interval: 1m
    input_series:
      - series: 'pg_up{job="postgres-exporter", instance="postgres-exporter:9187"}'
        values: "1 1 0 0 0 0 0 0"
      - series: 'redis_up{job="redis-exporter", instance="redis-exporter:9121"}'
        values: "1 1 1 1 1 1 1 1"
    alert_rule_test:
      - eval_time: 3m
        alertname: PostgresDown
        exp_alerts: []
      - eval_time: 7m
        alertname: PostgresDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: postgres-exporter
              instance: "postgres-exporter:9187"
            exp_annotations:
              summary: "Postgres is not reachable"
              description: "The Postgres exporter cannot connect to the database. Nothing can register or send alerts."
      - eval_time: 7m
        alertname: RedisDown
        exp_alerts: []

  - name: redis down
    interval: 1m
    input_series:
      - series: 'redis_up{job="redis-exporter", instance="redis-exporter:9121"}'
        values: "1 0 0 0 0 0"
    alert_rule_test:
      - eval_time: 5m
        alertname: RedisDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: redis-exporter
              instance: "redis-exporter:9121"
            exp_annotations:
              summary: "Redis is not reachable"
              description: "The Redis exporter cannot connect. Tickets, shard leases and presence depend on it."

  - name: connections are summed over all databases
    interval: 1m
    input_series:
      - series: 'pg_stat_database_numbackends{job="postgres-exporter", datname="pulsegrid"}'
        values: "50x10"
      - series: 'pg_stat_database_numbackends{job="postgres-exporter", datname="postgres"}'
        values: "35x10"
    alert_rule_test:
      - eval_time: 8m
        alertname: PostgresConnectionsHigh
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Postgres is close to its connection limit"
              description: "85 connections are open; Postgres allows 100 by default. Requests will start to fail."

  - name: a silent exporter is itself an alert
    interval: 1m
    input_series:
      - series: 'up{job="node-exporter", instance="node-exporter:9100"}'
        values: "1 1 0x10"
    alert_rule_test:
      - eval_time: 4m
        alertname: ExporterDown
        exp_alerts: []
      - eval_time: 9m
        alertname: ExporterDown
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node-exporter
              instance: "node-exporter:9100"
            exp_annotations:
              summary: "A monitoring exporter is not answering"
              description: "Prometheus cannot scrape node-exporter. Until it is back, the host, Postgres or Redis alerts below cannot fire."

  - name: disk metrics missing while the exporter answers is reported
    interval: 1m
    input_series:
      - series: 'up{job="node-exporter", instance="node-exporter:9100"}'
        values: "1x30"
      # Only an unrelated, nearly full filesystem exists. It must not satisfy
      # the guard, and it must not trigger the disk space rules either.
      - series: 'node_filesystem_avail_bytes{job="node-exporter", mountpoint="/mnt"}'
        values: "20x30"
      - series: 'node_filesystem_size_bytes{job="node-exporter", mountpoint="/mnt"}'
        values: "1000x30"
    alert_rule_test:
      - eval_time: 5m
        alertname: HostDiskMetricsMissing
        exp_alerts: [] # missing, but not for the required 10 minutes yet
      - eval_time: 20m
        alertname: HostDiskMetricsMissing
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "The disk alerts have no data"
              description: "node-exporter is answering but reports no filesystem mounted at / or /var/lib, so the disk space alerts cannot fire. Look at the mountpoints it reports and adjust the selector in alerts.yml."
      - eval_time: 20m
        alertname: HostDiskSpaceLow
        exp_alerts: []
      - eval_time: 20m
        alertname: HostDiskSpaceCritical
        exp_alerts: []

  - name: the guard stays quiet when the data filesystem is reported
    interval: 1m
    input_series:
      - series: 'up{job="node-exporter", instance="node-exporter:9100"}'
        values: "1x30"
      - series: 'node_filesystem_avail_bytes{job="node-exporter", mountpoint="/var/lib"}'
        values: "600x30"
      - series: 'node_filesystem_size_bytes{job="node-exporter", mountpoint="/var/lib"}'
        values: "1000x30"
    alert_rule_test:
      - eval_time: 25m
        alertname: HostDiskMetricsMissing
        exp_alerts: []

  - name: the guard stays quiet when the exporter itself is down
    interval: 1m
    input_series:
      - series: 'up{job="node-exporter", instance="node-exporter:9100"}'
        values: "0x30"
    alert_rule_test:
      - eval_time: 25m
        alertname: HostDiskMetricsMissing
        exp_alerts: [] # ExporterDown covers this case
      - eval_time: 25m
        alertname: ExporterDown
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node-exporter
              instance: "node-exporter:9100"
            exp_annotations:
              summary: "A monitoring exporter is not answering"
              description: "Prometheus cannot scrape node-exporter. Until it is back, the host, Postgres or Redis alerts below cannot fire."

  - name: a nearly full /var/lib (the Docker data disk) is caught
    interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{job="node-exporter", mountpoint="/var/lib"}'
        values: "100x40"
      - series: 'node_filesystem_size_bytes{job="node-exporter", mountpoint="/var/lib"}'
        values: "1000x40"
    alert_rule_test:
      - eval_time: 30m
        alertname: HostDiskSpaceLow
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node-exporter
              mountpoint: "/var/lib"
            exp_annotations:
              summary: "The server's disk is getting full"
              description: "Only 10% of the disk is free. Dumps, the database and logs all live on it."
