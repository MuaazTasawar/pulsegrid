name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@v2
      - name: Unit tests of every crate except the integration suite
        run: cargo test --workspace --exclude integration-tests --no-fail-fast -- --test-threads=1

  integration:
    name: Integration and end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@v2
      # These tests start their own Postgres, Redis and NATS with
      # testcontainers; GitHub's Ubuntu runners have Docker.
      - name: Integration tests
        run: cargo test -p integration-tests

  docker:
    name: Docker image builds
    # A release build takes many minutes, so it runs on main only. It also
    # publishes the image, so it waits for every test job: only a commit that
    # passed everything becomes an image that can be deployed.
    if: github.event_name == 'push'
    needs: [lint, unit, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # push to GitHub Container Registry
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # One image holds both binaries (api-coordinator and fanout-worker);
      # the container's command picks which one runs. The name must be
      # lowercase, so it is written out instead of taken from the repository.
      #   ghcr.io/muaaztasawar/pulsegrid:sha-<short commit>  (what to pin and roll back to)
      #   ghcr.io/muaaztasawar/pulsegrid:latest              (the newest main)
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/muaaztasawar/pulsegrid
          tags: |
            type=sha
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
