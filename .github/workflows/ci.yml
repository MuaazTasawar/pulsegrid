name: CI
# Every action is pinned to a full commit SHA (the tag it came from is in the
# comment) and runs on Node 24. Dependabot proposes updates: .github/dependabot.yml

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1, 2026-10-15
        with:
          toolchain: "1.97"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1, 2026-10-15
        with:
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Unit tests of every crate except the integration suite
        run: cargo test --workspace --exclude integration-tests --no-fail-fast

  integration:
    name: Integration and end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1, 2026-10-15
        with:
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # These tests start their own Postgres, Redis and NATS with
      # testcontainers; GitHub's Ubuntu runners have Docker.
      - name: Integration tests
        run: cargo test -p integration-tests

  deploy-files:
    name: Deployment files
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Keep these image tags in step with docker-compose.prod.yml.
    env:
      PROMETHEUS_IMAGE: prom/prometheus:v3.16.0
      ALERTMANAGER_IMAGE: prom/alertmanager:v0.35.0
      CADDY_IMAGE: caddy:2-alpine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Shell scripts pass shellcheck
        run: |
          shellcheck -s sh deploy/backup/backup.sh deploy/backup/restore.sh
          shellcheck -s bash deploy/deploy.sh deploy/tests/deploy_test.sh
      - name: Deploy script tests (against a fake docker)
        run: bash deploy/tests/deploy_test.sh
      - name: Compose files validate
        env:
          API_DOMAIN: api.example.com
          WS_DOMAIN: ws.example.com
          ACME_EMAIL: ops@example.com
          POSTGRES_PASSWORD: ci-only
        run: |
          cp .env.docker.example .env.docker
          mkdir -p deploy/secrets
          echo dummy > deploy/secrets/telegram_bot_token
          docker compose -f docker-compose.yml config -q
          docker compose --env-file .env.docker -f docker-compose.yml -f docker-compose.prod.yml config -q
          docker compose --env-file .env.docker -f docker-compose.yml -f docker-compose.scale.yml config -q
      - name: Caddyfile validates
        run: |
          docker run --rm \
            -e API_DOMAIN=api.example.com -e WS_DOMAIN=ws.example.com -e ACME_EMAIL=ops@example.com \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            "$CADDY_IMAGE" caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Prometheus config, alert rules and the rule tests
        run: |
          docker run --rm -v "$PWD/deploy/prometheus:/etc/prometheus:ro" \
            --entrypoint promtool "$PROMETHEUS_IMAGE" check config /etc/prometheus/prometheus.yml
          docker run --rm -v "$PWD/deploy/prometheus:/etc/prometheus:ro" \
            --entrypoint promtool "$PROMETHEUS_IMAGE" test rules /etc/prometheus/alerts_test.yml
      - name: Alertmanager config validates
        run: |
          docker run --rm \
            -v "$PWD/deploy/alertmanager:/c:ro" \
            -v "$PWD/deploy/secrets/telegram_bot_token:/run/secrets/telegram_bot_token:ro" \
            --entrypoint amtool "$ALERTMANAGER_IMAGE" check-config /c/alertmanager.yml

  docker:
    name: Docker image builds
    # A release build takes many minutes, so it runs on main only. It also
    # publishes the image, so it waits for every test job: only a commit that
    # passed everything becomes an image that can be deployed.
    if: github.event_name == 'push'
    needs: [lint, unit, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # push to GitHub Container Registry
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # One image holds both binaries (api-coordinator and fanout-worker);
      # the container's command picks which one runs. The name must be
      # lowercase, so it is written out instead of taken from the repository.
      #   ghcr.io/muaaztasawar/pulsegrid:sha-<short commit>  (what to pin and roll back to)
      #   ghcr.io/muaaztasawar/pulsegrid:latest              (the newest main)
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/muaaztasawar/pulsegrid
          tags: |
            type=sha
            type=raw,value=latest
      # Build the image once and keep it local: it is scanned before anything
      # is pushed, so an image with a known fixable HIGH or CRITICAL
      # vulnerability never becomes :latest.
      - name: Build the image (not pushed yet)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: pulsegrid:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Trivy is downloaded from its GitHub release and pinned by SHA-256, so
      # a swapped download fails the build. (A third-party action would be one
      # more thing to trust; the release binary is all that is needed.) To
      # update: pick a release at least two weeks old, take the Linux-64bit
      # hash from that release's trivy_<version>_checksums.txt, change both
      # values below together.
      # Only fixable findings count (--ignore-unfixed). Accepted findings go in
      # .trivyignore, each with a written reason.
      - name: Scan the image for known vulnerabilities (Trivy)
        env:
          TRIVY_VERSION: "0.76.1"
          TRIVY_SHA256: "c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0"
        run: |
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/trivy.tgz" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/trivy.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/trivy.tgz" -C "$RUNNER_TEMP" trivy
          docker save pulsegrid:scan -o "$RUNNER_TEMP/image.tar"
          "$RUNNER_TEMP/trivy" image --input "$RUNNER_TEMP/image.tar" \
            --ignorefile .trivyignore \
            --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 --no-progress
      # The same build again: every layer comes from the cache, so this only
      # tags and pushes what was just scanned.
      - name: Push the scanned image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
