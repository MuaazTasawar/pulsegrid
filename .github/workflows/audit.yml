name: Security audit
# Every action is pinned to a full commit SHA (the tag it came from is in the
# comment) and runs on Node 24. Dependabot proposes updates: .github/dependabot.yml

# New advisories appear without any change to our code, so this also runs on
# a schedule, not just when the lockfile changes.
on:
  push:
    branches: [main]
    paths:
      - "Cargo.lock"
      - ".cargo/audit.toml"
      - ".github/workflows/audit.yml"
  pull_request:
    branches: [main]
    paths:
      - "Cargo.lock"
      - ".cargo/audit.toml"
      - ".github/workflows/audit.yml"
  schedule:
    - cron: "17 3 * * 1" # Mondays, 03:17 UTC
  workflow_dispatch:

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The repository pins its toolchain, so install the same one; cargo
      # audit itself only reads Cargo.lock.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1, 2026-10-15
        with:
          toolchain: "1.97"
      # A prebuilt binary: compiling cargo-audit from source takes minutes.
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-audit
      - name: Audit Cargo.lock against the RustSec advisory database
        run: cargo audit
