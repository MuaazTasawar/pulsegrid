[package]
name = "integration-tests"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
domain = { path = "../crates/domain" }
infra = { path = "../crates/infra" }
api-coordinator = { path = "../crates/api-coordinator" }
fanout-worker = { path = "../crates/fanout-worker" }
axum = "0.8"
tokio = { version = "1", features = ["full", "test-util"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
serde_json = "1"
futures-util = "0.3"
async-nats = "0.50"
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = "0.30"

[dev-dependencies]
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["postgres", "redis", "nats"] }

[[test]]
name = "alert_dispatch_test"
path = "alert_dispatch_test.rs"

[[test]]
name = "db_lifecycle_test"
path = "db_lifecycle_test.rs"

[[test]]
name = "redis_nats_test"
path = "redis_nats_test.rs"

[[test]]
name = "e2e_fanout_test"
path = "e2e_fanout_test.rs"

[[test]]
name = "replay_test"
path = "replay_test.rs"

[[test]]
name = "security_test"
path = "security_test.rs"

[[test]]
name = "resilience_test"
path = "resilience_test.rs"
