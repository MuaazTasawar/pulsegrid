[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/infra",
    "crates/api-coordinator",
    "crates/fanout-worker",
    "crates/loadgen",
]

[workspace.package]
edition = "2021"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
