services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pulsegrid
      POSTGRES_PASSWORD: pulsegrid
      POSTGRES_DB: pulsegrid
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # The app services must not start until Postgres really accepts TCP
    # connections. -h 127.0.0.1 matters: during the first initialisation the
    # image runs a temporary server that only listens on a unix socket, and a
    # plain `pg_isready` would already report "ready" then.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U pulsegrid -d pulsegrid"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "6382:6379"

  nats:
    image: nats:2-alpine
    # -js turns on JetStream (durable, replayable alerts); -sd is its storage.
    command: ["-js", "-sd", "/data"]
    ports:
      - "4222:4222"
    volumes:
      - natsdata:/data

  # The two app services run INSIDE Docker, so they read .env.docker (service
  # names such as postgres:5432), not .env (localhost, for `cargo run`).
  # Create it once with:  .\scripts\gen-secrets.ps1 -Docker
  api-coordinator:
    build: .
    command: api-coordinator
    env_file: .env.docker
    ports:
      - "8090:8090"
    # Postgres has to be healthy (see its healthcheck); redis and nats only
    # have to have started. If anything still fails at start-up, retry a few
    # times instead of staying down.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      nats:
        condition: service_started
    restart: on-failure:5

  fanout-worker:
    build: .
    command: fanout-worker
    env_file: .env.docker
    ports:
      - "8081:8081"
    # Postgres has to be healthy (see its healthcheck); redis and nats only
    # have to have started. If anything still fails at start-up, retry a few
    # times instead of staying down.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      nats:
        condition: service_started
    restart: on-failure:5

volumes:
  pgdata:
  natsdata:
