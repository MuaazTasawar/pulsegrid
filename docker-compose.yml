services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pulsegrid
      POSTGRES_PASSWORD: pulsegrid
      POSTGRES_DB: pulsegrid
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6382:6379"

  nats:
    image: nats:2-alpine
    ports:
      - "4222:4222"

  api-coordinator:
    build: .
    command: api-coordinator
    env_file: .env
    ports:
      - "8090:8090"
    depends_on:
      - postgres
      - redis
      - nats

  fanout-worker:
    build: .
    command: fanout-worker
    env_file: .env
    ports:
      - "8081:8081"
    depends_on:
      - postgres
      - redis
      - nats

volumes:
  pgdata: