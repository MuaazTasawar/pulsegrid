# Production overlay: TLS edge, nothing but 80/443 exposed, production
# settings, and the application image pulled from the registry (CI builds and
# publishes it; the server never compiles). Use it on a server that has DNS
# records for API_DOMAIN and WS_DOMAIN (see deploy/PRODUCTION.md):
#
#   COMPOSE="docker compose --env-file .env.docker -f docker-compose.yml -f docker-compose.prod.yml"
#   $COMPOSE pull
#   $COMPOSE up -d --no-build
#
# Every command needs --env-file: Compose reads the ${...} values below from
# it (even for `logs` or `ps`), and the app services read the same file
# through `env_file`. Required values that are missing stop the command with
# a message instead of silently using a default.
#
# To build the image on this machine instead (for example to rehearse
# locally), use `up -d --build`; it tags the result with the same name.
#
# Do not combine it with docker-compose.scale.yml (the benchmark harness).

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env.docker}
      WS_DOMAIN: ${WS_DOMAIN:?set WS_DOMAIN in .env.docker}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env.docker}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificates: keep this volume, or issuance restarts from zero
      - caddy_config:/config
    depends_on:
      - api-coordinator
      - fanout-worker
    logging: *default-logging

  # The three data stores are reachable only on the Compose network.
  postgres:
    restart: unless-stopped
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.docker}
    logging: *default-logging

  redis:
    restart: unless-stopped
    ports: !reset []
    # Persist to disk: ack cursors and device locations survive a restart.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    logging: *default-logging

  nats:
    restart: unless-stopped
    ports: !reset []
    logging: *default-logging

  # Both services run the same image; the command from docker-compose.yml
  # picks the binary. PULSEGRID_VERSION (in .env.docker) pins a build, e.g.
  # sha-95b5948, and defaults to the newest main.
  # The app services have no published ports: Caddy is the only way in. That
  # is also what makes TRUST_PROXY_HEADERS safe (clients cannot reach the
  # services directly to forge X-Forwarded-For).
  api-coordinator:
    image: ghcr.io/muaaztasawar/pulsegrid:${PULSEGRID_VERSION:-latest}
    restart: unless-stopped
    ports: !reset []
    environment:
      PULSEGRID_ENV: production
      TRUST_PROXY_HEADERS: "true"
      RATE_LIMIT_DISABLED: "false"
      DATABASE_URL: postgres://pulsegrid:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.docker}@postgres:5432/pulsegrid
    logging: *default-logging

  fanout-worker:
    image: ghcr.io/muaaztasawar/pulsegrid:${PULSEGRID_VERSION:-latest}
    restart: unless-stopped
    ports: !reset []
    environment:
      PULSEGRID_ENV: production
      TRUST_PROXY_HEADERS: "true"
      RATE_LIMIT_DISABLED: "false"
      DATABASE_URL: postgres://pulsegrid:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.docker}@postgres:5432/pulsegrid
      # The address the coordinator hands to devices: it must be the public
      # TLS name served by Caddy, not localhost.
      WORKER_PUBLIC_URL: wss://${WS_DOMAIN:?set WS_DOMAIN in .env.docker}
    logging: *default-logging

volumes:
  caddy_data:
  caddy_config:
  redisdata:
